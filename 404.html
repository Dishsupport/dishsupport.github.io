    var x0 = null;
    el.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
    el.addEventListener('pointermove', function (e) { if (x0 !== null) el.style.transform = 'translateX(' + (e.clientX - x0) + 'px) rotate(' + (e.clientX - x0) / 20 + 'deg)'; });
    el.addEventListener('pointerup', function (e) { if (x0 === null) return; var d = e.clientX - x0; x0 = null; if (Math.abs(d) > 90) go(d > 0); else el.style.transform = ''; });
  }

  function send() {
    show('<div class="invcard"><div class="bigplate"><span>📨</span></div><h1>Wird gesendet …</h1></div>');
    rpc('submit_votes2', { p_code: code, p_device: dev, p_yes: sup ? yes.concat(['super:' + sup]) : yes, p_name: name || null }).then(function (r) {
      if (!r || r.expired) return show('<div class="invcard"><h1>Abgelaufen ⏰</h1><p>Diese Einladung ist leider abgelaufen.</p>' + cta() + '</div>');
      if (r.full) return show('<div class="invcard"><h1>Schon fertig</h1><p>Diese Runde hat schon fertig abgestimmt.</p>' + cta() + '</div>');
      try { localStorage.setItem(votedKey, '1'); } catch (e) {}
      result(r);
    }).catch(function () { show('<div class="invcard"><h1>Hoppla</h1><p>Deine Stimmen konnten nicht gesendet werden.</p><button class="b" id="again">Nochmal senden</button></div>'); document.getElementById('again').onclick = send; });
  }

  var timer = null, shownRev = '';
  function wait() {
    if (!cards.length) { loadCards().then(wait); return; }
    rpc('get_result', { p_code: code }).then(function (r) { result(r); }).catch(function () {});
  }
  function result(r) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!r) return;
    var names = (r.names || []).map(function (n) { return '<span>✅ ' + esc(n || 'Gast') + '</span>'; }).join('');
    if (!r.done) {
      var by0 = {}; cards.forEach(function (c) { by0[c.id] = c; });
      var lead = (r.tally || [])[0] && by0[r.tally[0].id] ? '<p><b>' + by0[r.tally[0].id].e + ' ' + esc(by0[r.tally[0].id].n) + ' liegt vorne mit ' + r.tally[0].y + ' ♥</b></p>' : '';
      var txt = r.open ? (r.votes || 0) + ((r.votes || 0) === 1 ? ' hat' : ' haben') + ' gewählt.' + (r.closes_at ? ' Das Ergebnis kommt um ' + hm(r.closes_at) + ' oder sobald alle da sind.' : '') : (r.votes || 0) + ' von ' + (r.size || 2) + ' sind fertig. Das Ergebnis erscheint hier automatisch, sobald alle gewählt haben.';
      show('<div class="invcard"><div class="bigplate"><span>⏳</span></div><h1>Danke' + (name ? ', ' + esc(name) : '') + '!</h1>' + '<p>' + txt + '</p>' + lead + '<div class="names">' + names + '</div>' + cta() + '</div>');
      timer = setTimeout(wait, 3000); return;
    }
    var by = {}; cards.forEach(function (c) { by[c.id] = c; });
    var ids = (r.matches || []).filter(function (x) { return x.indexOf('super:') !== 0; }).filter(function (x) { return by[x]; });
    var tally = (r.tally || []).slice(0, 6).map(function (x) { var c = by[x.id]; return c ? '<div class="row"><span>' + c.e + '</span><b>' + esc(c.n) + '</b><span class="v">♥ ' + x.y + (x.s ? ' ★ ' + x.s : '') + '</span></div>' : ''; }).join('');
    var pick = r.pick && by[r.pick] ? by[r.pick] : ids.length === 1 ? by[ids[0]] : null;
    var maps = function (c) { return '<a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.n + ', ' + (c.ort || 'Linz')) + '">Route in Google Maps</a>'; };
    var votes = (r.tally || []).filter(function (x) { return pick && x.id === pick.id; })[0];
    if (pick && r.group && shownRev !== (r.rev || 0) + ':' + pick.id) {
      // Jeder hat seinen Roulette-Moment: kurz durch die Favoriten wirbeln, dann das Ergebnis
      shownRev = (r.rev || 0) + ':' + pick.id;
      if (ids.length === 1) {
        // Klarer Sieger: Pfeil fliegt in die Zielscheibe
        show('<div class="invcard"><h1>Die Gruppe hat gewählt 🎯</h1><p>Es gibt einen klaren Sieger …</p><div class="ziel"><div class="scheibe"></div><div class="pfeil">➳</div></div><div class="zname"><div style="font-size:34px">' + pick.e + '</div><h2>' + esc(pick.n) + '</h2><p><b>Volltreffer! 🎯</b></p></div></div>');
        setTimeout(function () { result(r); }, 3200);
        return;
      }
      var pool = (r.tally || []).map(function (x) { return by[x.id]; }).filter(Boolean).slice(0, 6); if (pool.length < 2) pool = cards.slice(0, 4);
      show('<div class="invcard"><div class="bigplate"><span id="sp">🎲</span></div><h1>Die Gruppe hat gewählt</h1><p id="spn">…</p></div>');
      var k = 0, n = 0, iv = setInterval(function () { var c = pool[k++ % pool.length]; document.getElementById('sp').textContent = c.e; document.getElementById('spn').textContent = c.n;
        if (++n > 22) { clearInterval(iv); result(r); } }, 90 + n * 6);
      return;
    }
    if (pick && r.group) timer = setTimeout(wait, 5000); // kommt noch jemand dazu? -> Update
    if (pick) return show('<div class="invcard"><h1>Match! 🎉</h1>' + (votes ? '<p><b>' + votes.y + ' von ' + r.votes + ' wollen ins ' + esc(pick.n) + '</b></p>' : '') +
      (r.late ? '<p class="small">' + (r.late === 1 ? '1 Person hat' : r.late + ' Personen haben') + ' später noch abgestimmt – das Ergebnis bleibt.</p>' : '') + '<div class="card" style="min-height:0;box-shadow:none"><div class="emo">' + pick.e + '</div><h2>' + esc(pick.n) + '</h2>' + (pick.str ? '<div class="w">📍 ' + esc(pick.str) + '</div>' : '') + '<span class="chip">' + esc(pick.c) + '</span></div>' +
      maps(pick) + (tally ? '<p class="small" style="margin-top:18px">So wurde abgestimmt</p>' + tally : '') + cta() + '</div>');
    if (ids.length === 0) return show('<div class="invcard"><h1>Kein Match 😅</h1><p>' + (r.group ? 'Kein Lokal hat mindestens 2 Stimmen bekommen.' : 'Diesmal hat nichts gepasst.') + ' Probiert es mit einer neuen Runde.</p>' + tally + cta() + '</div>');
    show('<div class="invcard"><div class="bigplate"><span>🎲</span></div><h1>' + ids.length + (r.group ? ' Lokale gleichauf!' : ' Matches!') + '</h1><p>Das Rad entscheidet. Wer zuerst dreht, entscheidet für alle.</p>' +
      ids.map(function (x) { return '<div class="row"><span>' + by[x].e + '</span><b>' + esc(by[x].n) + '</b></div>'; }).join('') +
      '<button class="b" id="spin">🎲 Rad drehen</button>' + tally + '</div>');
    document.getElementById('spin').onclick = function () {
      var b = this; b.disabled = true; var k = 0, n = 0;
      var iv = setInterval(function () { b.textContent = by[ids[k++ % ids.length]].e + ' ' + by[ids[k % ids.length]].n; if (++n > 18) { clearInterval(iv); go(); } }, 110);
      function go() {
        var mine = ids[Math.floor(Math.random() * ids.length)];
        rpc('spin_shared', { p_code: code, p_device: dev, p_pick: mine }).then(result).catch(function () { result(Object.assign({}, r, { pick: mine })); });
      }
    };
    timer = setTimeout(wait, 4000); // falls jemand anderer schneller dreht
  }
})();
</script>
