<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Einladung – Dish</title>
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:520px;margin:0 auto;padding:40px 20px;color:#3A2A21;background:#FFF4E8;line-height:1.55;text-align:center}
h1{color:#F2682A;font-size:34px}
a.b{display:inline-block;background:#F2682A;color:#fff;padding:14px 22px;border-radius:14px;text-decoration:none;font-weight:700;margin:8px}
</style>
</head>
<body>
<div id="invite" hidden>
  <h1>Wohin essen? 🎲</h1>
  <p>Du wurdest zu einer Runde Dish eingeladen: 10 Lokale swipen, ein Match entscheidet.</p>
  <p id="dev"></p>
  <p id="store"></p>
  <p>Schon installiert? Dann tipp den Link in deiner Nachricht nochmal an.</p>
</div>
<div id="nf" hidden>
  <h1>Seite nicht gefunden</h1>
  <p><a href="/">Zur Startseite</a></p>
</div>
<script>
  var store = '';
  var isInvite = /\/r\/[0-9a-f]{12}/.test(location.pathname);
  document.getElementById(isInvite ? 'invite' : 'nf').hidden = false;
  var code = (location.pathname.match(/\/r\/([0-9a-f]{12})/) || [])[1];
  var t = new URLSearchParams(location.search).get('t');
  if (code && t && /^[0-9a-z.\-]+(:[0-9]+)?$/i.test(t)) {
    document.getElementById('dev').innerHTML = '<a class="b" href="exp://' + t + '/--/r/' + code + '">In Dish öffnen (Testphase)</a><br><small>Funktioniert mit Expo Go im selben WLAN.</small>';
  }
  document.getElementById('store').innerHTML = store
    ? '<a class="b" href="' + store + '">Dish im App Store laden</a>'
    : '<b>Dish kommt bald in den App Store.</b>';
</script>
</body>
</html>
