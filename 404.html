<!doctype html><html lang=de><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#F2682A"><link rel=icon href="/icon.png"><title>Einladung – Dish</title><meta name=description content="Dish: Swipen, matchen, essen gehen. Gemeinsam in einer Minute entscheiden, wo ihr essen geht."><style>:root{--o:#F2682A;--o2:#D9541A;--cream:#FFF4E8;--plate:#FFFAF3;--ink:#3A2A21;--soft:#8C6F5C;--line:#F3D9C2;--card:#FFFFFF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:ui-rounded,-apple-system,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;font-size:17px}
a{color:var(--o2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1040px;margin:0 auto;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:20px;letter-spacing:-.01em}
.plate{width:38px;height:38px;border-radius:50%;background:var(--o);display:grid;place-items:center;flex:0 0 auto}
.plate span{width:30px;height:30px;border-radius:50%;background:var(--plate);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--line);display:grid;place-items:center;color:var(--o);font-weight:800;font-size:10px;letter-spacing:-.02em}
.menu{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.menu a{text-decoration:none;color:var(--soft);font-weight:600;font-size:14px;padding:6px 10px;border-radius:99px}
.menu a:hover,.menu a[aria-current]{background:#fff;color:var(--ink)}
.doc{max-width:720px;margin:0 auto;padding:8px 20px 64px}
.doc article{background:var(--card);border-radius:24px;padding:28px 24px;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(120,60,20,.35)}
.doc h1{font-size:34px;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em;color:var(--ink)}
.doc h2{font-size:20px;margin:28px 0 6px;color:var(--o2)}
.doc p{margin:0 0 12px}
footer{max-width:1040px;margin:0 auto;padding:24px 20px 40px;color:var(--soft);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
footer nav{display:flex;gap:14px;flex-wrap:wrap}
footer a{color:var(--soft)}
@media (max-width:560px){.menu{display:none}.doc article{padding:22px 18px}.doc h1{font-size:28px}}
.inv{max-width:560px;margin:0 auto;padding:12px 20px 48px}
.invcard{background:#fff;border-radius:28px;padding:32px 24px;text-align:center;box-shadow:0 1px 0 var(--line),0 24px 50px -30px rgba(120,60,20,.45)}
.invcard h1{font-size:34px;letter-spacing:-.02em;margin:10px 0 8px}
.invcard p{color:var(--soft)}
.bigplate{width:96px;height:96px;margin:0 auto;border-radius:50%;background:var(--o);display:grid;place-items:center}
.bigplate span{width:76px;height:76px;border-radius:50%;background:var(--plate);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 7px var(--line);display:grid;place-items:center;font-size:34px}
a.b{display:inline-block;background:var(--o);color:#fff;padding:14px 22px;border-radius:16px;text-decoration:none;font-weight:700;margin:8px}
code{font-size:28px;letter-spacing:2px;background:var(--cream);padding:8px 14px;border-radius:12px;display:inline-block;margin:8px 0;color:var(--ink)}
</style></head><body><header class=top><a class=brand href="/"><span class=plate><span>dish</span></span>Dish</a><nav class=menu><a href="/support.html">Support</a><a href="/datenschutz.html">Datenschutz</a><a href="/nutzungsbedingungen.html">Nutzungsbedingungen</a><a href="/impressum.html">Impressum</a></nav></header><main class="inv"><div id="invite" class="invcard" hidden>
  <div class="bigplate"><span>🎲</span></div>
  <h1>Wohin essen?</h1>
  <p>Du wurdest zu einer Runde Dish eingeladen: 10 Lokale swipen, ein Match entscheidet.</p>
  <p id="dev"></p>
  <p id="store"></p>
</div>
<div id="nf" class="invcard" hidden>
  <h1>Seite nicht gefunden</h1>
  <p><a class="b" href="/">Zur Startseite</a></p>
</div></main>
<script>
  var store = '';
  var isInvite = /\/r\/[0-9a-f]{12}/.test(location.pathname);
  document.getElementById(isInvite ? 'invite' : 'nf').hidden = false;
  var code = (location.pathname.match(/\/r\/([0-9a-f]{12})/) || [])[1];
  var t = new URLSearchParams(location.search).get('t');
  var dev = '';
  if (code && t && /^[0-9a-z.\-]+(:[0-9]+)?$/i.test(t)) {
    dev += '<a class="b" href="exp://' + t + '/--/r/' + code + '">In Dish öffnen (Testphase)</a><br><small>Funktioniert mit Expo Go im selben WLAN.</small><br><br>';
  }
  if (code) {
    dev += '<small>Klappt der Knopf nicht? Öffne Dish in Expo Go und gib unten bei „Code aus Einladung“ diesen Code ein:</small><br><code>' + code + '</code>';
  }
  document.getElementById('dev').innerHTML = dev;
  document.getElementById('store').innerHTML = store
    ? '<a class="b" href="' + store + '">Dish im App Store laden</a>'
    : '<b>Dish kommt bald in den App Store.</b>';
</script>
<footer><span>© 2026 Dish · Edina Hotea, Linz, Österreich</span><nav><a href="/support.html">Support</a><a href="/datenschutz.html">Datenschutz</a><a href="/nutzungsbedingungen.html">Nutzungsbedingungen</a><a href="/impressum.html">Impressum</a></nav></footer></body></html>
